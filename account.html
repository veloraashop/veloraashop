<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>حساب کاربری | ولورا شاپ</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --p: #913b60;
      --bg: #fffcf8;
      --line: #eadde1;
      --text: #30252b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(140deg,#fff9fb,var(--bg));
      font-family: Vazirmatn,sans-serif;
      color: var(--text);
    }

    a { color: var(--p); }

    .wrap { max-width: 1000px; margin: auto; padding: 24px; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--p);
      text-decoration: none;
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: clamp(18px,4vw,36px);
      margin-bottom: 22px;
      box-shadow: 0 16px 55px #913b6010;
    }

    .muted { color: #776b70; }

    .tabs { display: flex; gap: 8px; margin: 20px 0; }

    button, .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      background: var(--p);
      color: white;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .tabs button { background: #f8e9ee; color: var(--p); }
    .tabs button.active { background: var(--p); color: white; }
    .secondary { background: #f8e9ee; color: var(--p); }

    .formgrid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1/-1; }

    label { font-size: 14px; font-weight: 600; }

    input, textarea {
      width: 100%;
      font: inherit;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      min-width: 0;
      background: white;
      color: var(--text);
    }

    textarea { min-height: 95px; resize: vertical; }

    input:focus, textarea:focus {
      outline: 2px solid #d88fa766;
      border-color: var(--p);
    }

    .notice { padding: 12px; border-radius: 12px; margin: 12px 0; }
    .notice[hidden] { display: none; }
    .notice.ok { background: #e8f5e9; color: #21652a; }
    .notice.bad { background: #fff0f2; color: #9b244b; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .profilehead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .pill { background: #f8e9ee; color: var(--p); padding: 5px 12px; border-radius: 99px; font-size: 13px; }

    .section-title {
      grid-column: 1/-1;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      margin: 14px 0 0;
      color: var(--p);
      font-size: 17px;
    }

    @media(max-width:600px) {
      .formgrid { grid-template-columns: 1fr; }
      .field.full, .section-title { grid-column: auto; }
      .top { align-items: flex-start; }
    }
  </style>

  <script src="assets/js/account-auth.js" defer></script>
</head>

<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="index.html">Veloraa Shop</a>
    <a href="index.html">بازگشت به فروشگاه ←</a>
  </header>

  <section>
    <h1>حساب کاربری شما</h1>
    <p class="muted">به دنیای زیبایی ولورا خوش آمدی.</p>
  </section>

  <div id="auth-message" class="notice" role="status" aria-live="polite" hidden></div>

  <section class="panel" id="auth-forms">
    <div class="tabs">
      <button type="button" class="active" data-pane="login-pane">ورود</button>
      <button type="button" data-pane="signup-pane">ثبت‌نام</button>
    </div>

    <form id="login-form">
      <div id="login-pane" class="formgrid">
        <div class="field full">
          <label for="login-email">ایمیل</label>
          <input id="login-email" type="email" autocomplete="email" required>
        </div>
        <div class="field full">
          <label for="login-password">رمز عبور</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">ورود به حساب</button>
        <button class="btn secondary" type="button" id="reset-password">بازیابی رمز عبور</button>
      </div>
    </form>

    <form id="signup-form" hidden>
      <div class="formgrid">
        <h3 class="section-title">اطلاعات حساب</h3>

        <div class="field">
          <label for="signup-name">نام و نام خانوادگی</label>
          <input id="signup-name" autocomplete="name" maxlength="120" required>
        </div>

        <div class="field">
          <label for="signup-email">ایمیل</label>
          <input id="signup-email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="signup-phone">شماره موبایل</label>
          <input id="signup-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="09123456789" required>
        </div>

        <div class="field">
          <label for="signup-national-id">کد ملی</label>
          <input id="signup-national-id" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="۱۰ رقم" required>
        </div>

        <div class="field">
          <label for="signup-birth-date">تاریخ تولد</label>
          <input id="signup-birth-date" type="date" autocomplete="bday">
        </div>

        <div class="field">
          <label for="signup-password">رمز عبور (حداقل ۱۰ نویسه)</label>
          <input id="signup-password" type="password" minlength="10" autocomplete="new-password" required>
        </div>

        <h3 class="section-title">اطلاعات گیرنده و نشانی</h3>

        <div class="field">
          <label for="signup-recipient">نام گیرنده سفارش</label>
          <input id="signup-recipient" maxlength="120" autocomplete="shipping name">
        </div>

        <div class="field">
          <label for="signup-alt-phone">شماره تماس جایگزین</label>
          <input id="signup-alt-phone" type="tel" maxlength="20">
        </div>

        <div class="field">
          <label for="signup-province">استان</label>
          <input id="signup-province" maxlength="100" autocomplete="address-level1">
        </div>

        <div class="field">
          <label for="signup-city">شهر</label>
          <input id="signup-city" maxlength="100" autocomplete="address-level2">
        </div>

        <div class="field">
          <label for="signup-postal">کد پستی</label>
          <input id="signup-postal" inputmode="numeric" maxlength="10" autocomplete="postal-code">
        </div>

        <div class="field">
          <label for="signup-street">خیابان / بلوار</label>
          <input id="signup-street" maxlength="200" autocomplete="address-line1">
        </div>

        <div class="field">
          <label for="signup-alley">کوچه</label>
          <input id="signup-alley" maxlength="150">
        </div>

        <div class="field">
          <label for="signup-building">پلاک</label>
          <input id="signup-building" maxlength="20">
        </div>

        <div class="field">
          <label for="signup-floor">طبقه</label>
          <input id="signup-floor" maxlength="10">
        </div>

        <div class="field">
          <label for="signup-unit">واحد</label>
          <input id="signup-unit" maxlength="10">
        </div>

        <div class="field full">
          <label for="signup-address-details">توضیحات تکمیلی نشانی</label>
          <textarea id="signup-address-details" maxlength="1000" autocomplete="off"></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn" type="submit">ساخت حساب کاربری</button>
      </div>
    </form>
  </section>

  <section class="panel" id="profile-panel" hidden>
    <div class="profilehead">
      <div>
        <h2>پروفایل من</h2>
        <p class="muted" id="profile-email"></p>
      </div>
      <span class="pill" id="profile-role">مشتری</span>
    </div>

    <form id="profile-form">
      <div class="formgrid">
        <h3 class="section-title">اطلاعات حساب</h3>

        <div class="field">
          <label for="profile-name">نام و نام خانوادگی</label>
          <input id="profile-name" maxlength="120" required>
        </div>

        <div class="field">
          <label for="profile-phone">شماره موبایل</label>
          <input id="profile-phone" type="tel" maxlength="20" required>
        </div>

        <div class="field">
          <label for="profile-national-id">کد ملی</label>
          <input id="profile-national-id" inputmode="numeric" maxlength="10" required>
        </div>

        <div class="field">
          <label for="profile-birth-date">تاریخ تولد</label>
          <input id="profile-birth-date" type="date">
        </div>

        <h3 class="section-title">اطلاعات گیرنده و نشانی</h3>

        <div class="field">
          <label for="profile-recipient">نام گیرنده سفارش</label>
          <input id="profile-recipient" maxlength="120">
        </div>

        <div class="field">
          <label for="profile-alt-phone">شماره تماس جایگزین</label>
          <input id="profile-alt-phone" type="tel" maxlength="20">
        </div>

        <div class="field">
          <label for="profile-province">استان</label>
          <input id="profile-province" maxlength="100">
        </div>

        <div class="field">
          <label for="profile-city">شهر</label>
          <input id="profile-city" maxlength="100">
        </div>

        <div class="field">
          <label for="profile-postal">کد پستی</label>
          <input id="profile-postal" inputmode="numeric" maxlength="10">
        </div>

        <div class="field">
          <label for="profile-street">خیابان / بلوار</label>
          <input id="profile-street" maxlength="200">
        </div>

        <div class="field">
          <label for="profile-alley">کوچه</label>
          <input id="profile-alley" maxlength="150">
        </div>

        <div class="field">
          <label for="profile-building">پلاک</label>
          <input id="profile-building" maxlength="20">
        </div>

        <div class="field">
          <label for="profile-floor">طبقه</label>
          <input id="profile-floor" maxlength="10">
        </div>

        <div class="field">
          <label for="profile-unit">واحد</label>
          <input id="profile-unit" maxlength="10">
        </div>

        <div class="field full">
          <label for="profile-address-details">توضیحات تکمیلی نشانی</label>
          <textarea id="profile-address-details" maxlength="1000"></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn" type="submit">ذخیره تغییرات</button>
        <a class="btn secondary" id="admin-link" href="admin.html" hidden>ورود به پنل مدیریت</a>
        <button class="btn secondary" id="logout" type="button">خروج از حساب</button>
      </div>
    </form>

    <p class="muted">تاریخچه سفارش‌ها پس از راه‌اندازی سیستم سفارش‌ها اضافه می‌شود.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script>
<script src="assets/js/appwrite-client.js"></script>

<script>
  document.querySelectorAll(".tabs button").forEach(function (button) {
    button.addEventListener("click", function () {
      const signup = button.dataset.pane === "signup-pane";

      document.getElementById("login-form").hidden = signup;
      document.getElementById("signup-form").hidden = !signup;

      document.querySelectorAll(".tabs button").forEach(function (item) {
        item.classList.toggle("active", item === button);
      });
    });
  });
</script>
</body>
</html>
