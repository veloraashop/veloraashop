<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری | ولورا شاپ</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#913b60;--pink:#d88fa7;--bg:#fffcf8;--line:#eadde1;--text:#30252b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#fff9fb,var(--bg));font-family:Vazirmatn,sans-serif;color:var(--text)}a{color:var(--p)}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}.brand{font-size:24px;font-weight:800;color:var(--p);text-decoration:none}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,36px);box-shadow:0 16px 55px #913b6010}.hero{margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:clamp(25px,4vw,36px)}.muted{color:#776b70}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button,.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--p);color:white;font:inherit;cursor:pointer}.tabs button{background:#f8e9ee;color:var(--p)}.tabs button.active{background:var(--p);color:white}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:14px;font-weight:600}input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;min-width:0}input:focus{outline:2px solid #d88fa766;border-color:var(--p)}.notice{padding:12px;border-radius:12px;margin:12px 0}.notice[hidden]{display:none}.notice.ok{background:#e8f5e9;color:#21652a}.notice.bad{background:#fff0f2;color:#9b244b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.secondary{background:#f8e9ee;color:var(--p)}.profilehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#f8e9ee;color:var(--p);padding:5px 12px;border-radius:99px;font-size:13px}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/account-auth.js" defer></script></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">Veloraa Shop</a><a href="index.html">بازگشت به فروشگاه ←</a></header><section class="hero"><h1>حساب کاربری شما</h1><p class="muted">به دنیای زیبایی ولورا خوش آمدی؛ وارد شو یا حساب جدید بساز.</p></section><div id="auth-message" class="notice" hidden></div><section class="panel" id="auth-forms"><div class="tabs"><button type="button" class="active" data-pane="login-pane" onclick="showPane('login-pane',this)">ورود</button><button type="button" data-pane="signup-pane" onclick="showPane('signup-pane',this)">ثبت‌نام</button></div><form id="login-form"><div id="login-pane"><div class="formgrid"><div class="field full"><label for="login-email">ایمیل</label><input id="login-email" type="email" autocomplete="email" required></div><div class="field full"><label for="login-password">رمز عبور</label><input id="login-password" type="password" autocomplete="current-password" required></div></div><div class="actions"><button class="btn" type="submit">ورود به حساب</button><button class="btn secondary" type="button" id="reset-password">بازیابی رمز عبور</button></div></div></form><form id="signup-form" hidden><div id="signup-pane"><div class="formgrid"><div class="field full"><label for="signup-name">نام و نام خانوادگی</label><input id="signup-name" autocomplete="name" required maxlength="100"></div><div class="field full"><label for="signup-email">ایمیل</label><input id="signup-email" type="email" autocomplete="email" required></div><div class="field full">
  <label for="signup-phone">شماره تماس</label>
  <input
    id="signup-phone"
    type="tel"
    autocomplete="tel"
    inputmode="tel"
    maxlength="30"
    placeholder="مثلاً 09123456789"
    required
  >
</div><div class="field full"><label for="signup-password">رمز عبور (حداقل ۱۰ نویسه)</label><input id="signup-password" type="password" minlength="10" autocomplete="new-password" required></div></div><div class="actions"><button class="btn" type="submit">ساخت حساب کاربری</button></div></div></form></section><section class="panel" id="profile-panel" hidden><div class="profilehead"><div><h2>پروفایل من</h2><p class="muted" id="profile-email"></p></div><span class="pill" id="profile-role">مشتری</span></div><form id="profile-form"><div class="formgrid"><div class="field"><label for="profile-name">نام و نام خانوادگی</label><input id="profile-name" maxlength="100"></div><div class="field"><label for="profile-phone">شماره تماس</label><input id="profile-phone" type="tel" maxlength="30"></div></div><div class="actions"><button class="btn" type="submit">ذخیره پروفایل</button><a class="btn secondary" id="admin-link" href="admin.html" hidden>ورود به پنل مدیریت</a><button class="btn secondary" id="logout" type="button">خروج از حساب</button></div></form><p class="muted">تاریخچه سفارش‌ها پس از اتصال و راه‌اندازی جریان سفارش ثبت‌شده در نسخه بعدی این پنل اضافه می‌شود.</p></section></main><script>function showPane(id,btn){document.getElementById('login-form').hidden=id!=='login-pane';document.getElementById('signup-form').hidden=id!=='signup-pane';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===btn));}</script></body></html>
